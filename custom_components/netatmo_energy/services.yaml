set_schedule:
  target:
    entity:
      integration: netatmo_energy
      domain: climate
  fields:
    schedule_name:
      required: true
      example: Vinter
      selector:
        text:

set_preset_mode_with_end_datetime:
  target:
    entity:
      integration: netatmo_energy
      domain: climate
  fields:
    preset_mode:
      required: true
      example: away
      selector:
        select:
          translation_key: timed_preset
          options:
            - away
            - frost_guard
            - boost
    end_datetime:
      required: true
      example: '"2026-11-20 06:00:00"'
      selector:
        datetime:

set_temperature_with_end_datetime:
  target:
    entity:
      integration: netatmo_energy
      domain: climate
  fields:
    target_temperature:
      required: true
      example: 19.5
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    end_datetime:
      required: true
      example: '"2026-11-20 06:00:00"'
      selector:
        datetime:

set_temperature_with_time_period:
  target:
    entity:
      integration: netatmo_energy
      domain: climate
  fields:
    target_temperature:
      required: true
      example: 19.5
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    time_period:
      required: true
      default:
        hours: 3
        minutes: 0
        seconds: 0
        days: 0
      selector:
        duration:

clear_temperature_setting:
  target:
    entity:
      integration: netatmo_energy
      domain: climate

register_webhook:

unregister_webhook:
